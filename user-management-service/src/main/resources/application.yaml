spring:
  application:
    name: user-management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:dev-password}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true